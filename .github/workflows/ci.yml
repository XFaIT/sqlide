name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - name: Tests
        shell: bash
        run: uv run pytest -q --tb=short -p no:cacheprovider 2>&1 | tee pytest.log; exit "${PIPESTATUS[0]}"
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)|Error|assert " pytest.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
