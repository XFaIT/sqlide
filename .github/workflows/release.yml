name: Release

# Every push to main with a version that has no v<version> tag yet is a release:
# CI green -> PyPI (needs your approval) -> tag -> PR in the Homebrew tap (its brew install
# tests run on the PR, and it merges itself when they are green).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.v.outputs.new }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "releasing $version"
          fi

  ci-green:
    # Never publish a commit whose CI is red or missing.
    needs: detect
    if: needs.detect.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI on the tagged commit
        run: |
          for _ in $(seq 1 90); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.name | startswith("test (")) | .conclusion // "pending"')
            echo "$runs"
            if [ "$(echo "$runs" | grep -c .)" -ge 2 ] && ! echo "$runs" | grep -q pending; then
              echo "$runs" | grep -qv '^success$' && { echo "::error::CI is not green on $GITHUB_SHA"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::CI did not finish for $GITHUB_SHA"; exit 1

  pypi:
    needs: [detect, ci-green]
    if: needs.detect.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, no token stored
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish

  tag:
    needs: [detect, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v${{ needs.detect.outputs.version }}" -f sha="$GITHUB_SHA"

  homebrew:
    # Opens a PR in the tap with the new url/sha256 once the sdist is on PyPI and turns on
    # auto-merge, so the tap's brew tests decide whether it lands.
    # Needs the TAP_TOKEN secret: a fine-grained token for XFaIT/homebrew-sqlide
    # with Contents and Pull requests read/write.
    needs: [detect, tag]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Check the token exists
        run: test -n "$GH_TOKEN" || { echo "::error::secret TAP_TOKEN is not set"; exit 1; }
      - name: Wait for the sdist on PyPI
        run: |
          version="${{ needs.detect.outputs.version }}"
          for _ in $(seq 1 60); do
            curl -sf "https://pypi.org/pypi/sqlide/$version/json" -o pypi.json && \
              python3 -I - "$version" <<'PY' && exit 0
          import json, sys
          d = json.load(open("pypi.json"), strict=False)
          sdist = next(u for u in d["urls"] if u["packagetype"] == "sdist")
          open("formula.env", "w").write(f"URL={sdist['url']}\nSHA={sdist['digests']['sha256']}\n")
          PY
            sleep 20
          done
          echo "::error::sqlide $version never appeared on PyPI"; exit 1
      - name: Open the tap PR
        run: |
          version="${{ needs.detect.outputs.version }}"
          . ./formula.env
          gh repo clone XFaIT/homebrew-sqlide tap -- -q
          cd tap
          sed -i "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/sqlide.rb
          git diff --quiet && { echo "formula already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$version"
          git commit -qam "sqlide $version"
          git push -q origin "release/$version"
          gh pr create -R XFaIT/homebrew-sqlide -B main -H "release/$version" \
            -t "sqlide $version" -b "url and sha256 of the $version sdist on PyPI. Opened by the release workflow."
          gh pr merge -R XFaIT/homebrew-sqlide "release/$version" --auto --squash --delete-branch
