[project]
name = "sqlide"
version = "0.1.1"
description = "Terminal SQL IDE (DataGrip-like) over JDBC"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "XFaIT" }]
keywords = ["sql", "jdbc", "tui", "terminal", "database", "datagrip"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "tree-sitter>=0.23",
    "tree-sitter-sql>=0.3",
    "tree-sitter-json>=0.24",
    "jpype1>=1.5",
    "openpyxl>=3.1",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "sqlglot>=25",
]

[project.urls]
Homepage = "https://github.com/XFaIT/sqlide"
Repository = "https://github.com/XFaIT/sqlide"
Issues = "https://github.com/XFaIT/sqlide/issues"

[project.scripts]
sqlide = "sqlide.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "textual-dev>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlide"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
asyncio_mode = "auto"
markers = ["docker: needs Docker (postgres, clickhouse)"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
